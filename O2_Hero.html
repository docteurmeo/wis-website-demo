<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wed in Style - Option 2 Hero (The Walk)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{ --ink:#161310; --accent:#A9633B; --serif:'Instrument Serif',Georgia,serif; --hand:'Pinyon Script',cursive; }
*{margin:0;padding:0;box-sizing:border-box}
  html{scrollbar-width:thin;scrollbar-color:rgba(169,99,59,.45) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(169,99,59,.4);border-radius:10px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(169,99,59,.66);background-clip:content-box}
  ::-webkit-scrollbar-corner{background:transparent}
html,body{height:100%}
body{font-family:var(--serif);color:var(--ink);background:#fff;overflow-x:hidden}
img{display:block}

.hero{position:relative;height:100vh;overflow:hidden;background:#ffffff}

/* header: split menu around centre logo */
.header{position:absolute;top:0;left:0;right:0;z-index:7;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:24px clamp(20px,4vw,56px);opacity:0;transition:opacity 1s ease .2s}
.hero.on .header{opacity:1}
.nav{display:flex;align-items:center;gap:clamp(16px,2.4vw,40px)}
.nav.l{justify-self:start}.nav.r{justify-self:end}
.nav a{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(22,19,16,.72);text-decoration:none;transition:color .3s;white-space:nowrap}
.nav a:hover{color:var(--accent)}
.brandlogo{width:clamp(58px,6vw,86px);height:auto;filter:brightness(0);opacity:.92}
@media(max-width:760px){ .nav{gap:12px} .nav a{font-size:.58rem;letter-spacing:.1em} }

/* drifting street of signs */
.street{position:absolute;inset:0;perspective:1000px;transform-style:preserve-3d;z-index:1;will-change:transform}
.sign{position:absolute;top:50%;left:50%;width:var(--w,190px);
  box-shadow:0 22px 48px rgba(0,0,0,.16),0 4px 12px rgba(0,0,0,.10);
  will-change:transform,opacity,filter;animation:drift linear infinite}
.sign img{width:100%;height:auto;filter:saturate(.94) contrast(.99)}
@keyframes drift{
  0%{transform:translate(-50%,-50%) translate3d(calc(var(--dx)*30px),calc(var(--dy)*30px),-1750px);opacity:0;filter:blur(13px)}
  8%{opacity:1}
  48%{filter:blur(0)}
  100%{transform:translate(-50%,-50%) translate3d(calc(var(--dx)*940px),calc(var(--dy)*600px),480px);opacity:1;filter:blur(0)}
}

/* light pool so slogan reads over photos */
.veil{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(closest-side at 50% 47%, rgba(255,255,255,.94) 0%, rgba(255,255,255,.6) 36%, rgba(255,255,255,0) 66%)}

/* centre slogan */
.centre{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 6vw}
.centre h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.9rem,7.6vw,7.6rem);line-height:.98;letter-spacing:-.005em;color:var(--ink);
  text-shadow:0 2px 30px rgba(255,255,255,.7)}
.centre h1 .w{display:inline-block;opacity:0;transform:translateY(20px);transition:opacity .9s ease,transform 1s cubic-bezier(.16,1,.3,1)}
.centre h1 em{font-style:italic;font-weight:330}
.centre .sig{font-family:var(--hand);font-weight:400;font-size:clamp(2rem,3.8vw,3.6rem);color:var(--accent);margin-top:6px;line-height:1.5;padding:.14em .6em .34em;
  transform:rotate(-3deg);clip-path:inset(0 100% 0 0);transition:clip-path 1.5s cubic-bezier(.5,0,.2,1) .9s}

.hero.on h1 .w{opacity:1;transform:none}
.hero.on h1 .w:nth-child(1){transition-delay:.15s}
.hero.on h1 .w:nth-child(2){transition-delay:.3s}
.hero.on h1 .w:nth-child(3){transition-delay:.45s}
.hero.on .sig{clip-path:inset(0 0 0 0)}

@media(prefers-reduced-motion:reduce){ .sign{animation-duration:0s;opacity:1;filter:none} }
</style>
</head>
<body>
<section class="hero" id="hero">
  <header class="header">
    <nav class="nav l"><a href="#">Our Works</a><a href="#">Approach</a><a href="#">Destination</a></nav>
    <img class="brandlogo" src="assets/wis_logo_mark.svg" alt="Wed in Style">
    <nav class="nav r"><a href="#">Services</a><a href="#">Journal</a><a href="#">Contact</a></nav>
  </header>
  <div class="street" id="street"></div>
  <div class="veil"></div>
  <div class="centre">
    <h1><span class="w">We craft</span> <span class="w"><em>glory</em></span> <span class="w">stories.</span></h1>
    <div class="sig">let us find yours.</div>
  </div>
</section>

<script>
(function(){
  var imgs=[
    'assets/preload/hero_ninhbinh.jpg','assets/preload/p1_davidthuy.jpg','assets/preload/p2_snp.jpg',
    'assets/preload/p3_catherine.jpg','assets/preload/p5_vdn.jpg','assets/cases/cj_hero.jpg',
    'assets/cases/cj_s3.jpg','assets/cases/cj_x7.jpg','assets/cases/cj_g5.jpg','assets/cases/cj_s1.jpg',
    'assets/works/km1.jpg','assets/works/pl1.jpg','assets/works/cp2.jpg','assets/works/cj1.jpg'
  ];
  var street=document.getElementById('street');
  var N=imgs.length;
  for(var i=0;i<N;i++){
    var a=(i/N)*Math.PI*2 + (Math.random()-0.5)*0.55;
    var r=0.75+Math.random()*0.6;
    var dx=(Math.cos(a)*r).toFixed(3);
    var dy=(Math.sin(a)*0.6*r).toFixed(3);
    var w=150+Math.round(Math.random()*120);
    var dur=(10+Math.random()*7);
    var delay=(-Math.random()*dur).toFixed(2);
    var d=document.createElement('div'); d.className='sign';
    d.style.setProperty('--dx',dx); d.style.setProperty('--dy',dy); d.style.setProperty('--w',w+'px');
    d.style.animationDuration=dur.toFixed(2)+'s'; d.style.animationDelay=delay+'s';
    var im=document.createElement('img'); im.src=imgs[i]; im.alt='';
    d.appendChild(im); street.appendChild(d);
  }
  requestAnimationFrame(function(){ setTimeout(function(){ document.getElementById('hero').classList.add('on'); }, 200); });
  var tx=0,ty=0,cx=0,cy=0,raf=false;
  function loop(){ cx+=(tx-cx)*.06; cy+=(ty-cy)*.06; street.style.transform='translate3d('+cx.toFixed(2)+'px,'+cy.toFixed(2)+'px,0)';
    if(Math.abs(tx-cx)>.1||Math.abs(ty-cy)>.1){requestAnimationFrame(loop);}else{raf=false;} }
  document.addEventListener('mousemove',function(e){ tx=-(e.clientX/window.innerWidth-.5)*26; ty=-(e.clientY/window.innerHeight-.5)*26; if(!raf){raf=true;requestAnimationFrame(loop);} });
})();
</script>
</body>
</html>
