<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIS - Featured Works</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  :root{
    --ink:#160F08; --bone:#EEE6D4; --dim:#9A8E76; --gold:#C6A15B;
    --title:'Mirage','Palatino Linotype',Georgia,serif;
    --body:'SweetSans','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--ink);color:var(--bone);font-family:var(--body);overflow-x:hidden}

  .works{position:relative;padding:0 0 12vh}
  .whead-band{height:54vh;display:flex;align-items:center;overflow:hidden}
  .whead{white-space:nowrap;font-family:var(--title);font-weight:400;font-size:10.42vw;line-height:1;
    color:var(--bone);padding-left:56px;margin:0;transform:translateX(100vw);will-change:transform}
  .wintro{padding:0 56px 8vh;margin:0;max-width:min(1006px,86vw);font-family:var(--title);font-weight:200;
    font-size:clamp(1.3rem,2.08vw,40px);line-height:1.42;color:var(--bone)}

  .projects{position:relative;margin-top:36vh}
  /* & : faint backdrop, BEHIND the images */
  .ampbar{position:sticky;top:50vh;height:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .7s ease}
  .ampbar.show{opacity:1}
  .amp{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);width:46.4vw}
  .amp svg{width:100%;height:auto;display:block}
  /* names + tagline : ABOVE the images */
  .namebar{position:sticky;top:50vh;height:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .7s ease}
  .namebar.show{opacity:1}
  .nm{position:absolute;top:0;transform:translateY(-50%);font-family:var(--title);font-weight:400;
    font-size:10.42vw;line-height:1;color:var(--gold);transition:opacity .3s ease;text-shadow:0 2px 46px rgba(0,0,0,.4)}
  .bride{left:56px}
  .groom{right:56px}
  .slogan{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);font-family:var(--body);font-weight:500;
    font-size:clamp(.8rem,1.04vw,20px);letter-spacing:.28em;text-transform:uppercase;color:var(--bone);
    white-space:nowrap;transition:opacity .3s ease;text-shadow:0 2px 34px rgba(0,0,0,.7)}

  .gallery{position:relative;z-index:2;width:min(30.5vw,586px);margin:0 auto;padding:16vh 0}
  .g{overflow:hidden;margin:0 0 13vh}
  .g img{width:100%;height:100%;object-fit:cover;display:block;clip-path:inset(0 0 0 100%);
    transition:clip-path .95s cubic-bezier(.76,0,.20,1)}
  .g.vis img{clip-path:inset(0 0 0 0)}
  .gA{width:100%;aspect-ratio:3/4}
  .gB{width:57.3%;aspect-ratio:4/5;margin-left:auto}
  .gC{width:78.3%;aspect-ratio:5/4;margin-right:auto}
  .pcap{position:relative;z-index:2;display:flex;justify-content:center;gap:16px;margin:7vh 0 0;
    font-family:var(--body);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .pcap b{color:var(--dim);font-weight:400}

  @media(max-width:820px){
    .gallery{width:min(62vw,420px)} .amp{width:70vw} .nm{font-size:17vw} .whead{font-size:17vw}
  }
  @media(prefers-reduced-motion:reduce){ .g img{clip-path:none!important;transition:none} .whead{transform:none!important;transition:none} }
</style>
</head>
<body>
  <section class="works" id="works">
    <div class="whead-band"><h2 class="whead" id="whead">Selected glory stories</h2></div>
    <p class="wintro">Each begins with one small truth. The rest is made around it.</p>

      </div>
      <div class="namebar" id="namebar">
        <span class="nm bride" id="bride">C</span>
        <span class="nm groom" id="groom">J</span>
        <span class="slogan" id="slogan">Love flavor</span>
      </div>

      <div class="gallery" data-b="C" data-g="J" data-slogan="Love flavor">
        <figure class="g gA"><img src="../assets/works/cj1.jpg" alt=""></figure>
        <figure class="g gB"><img src="../assets/works/cj2.jpg" alt=""></figure>
        <figure class="g gC"><img src="../assets/works/cj3.jpg" alt=""></figure>
        <div class="pcap"><b>Catherine &amp; Johnny</b><span>Ninh Binh, Vietnam</span></div>
      </div>

      <div class="gallery" data-b="K" data-g="M" data-slogan="Ace of heart">
        <figure class="g gA"><img src="../assets/works/km1.jpg" alt=""></figure>
        <figure class="g gB"><img src="../assets/works/km2.jpg" alt=""></figure>
        <figure class="g gC"><img src="../assets/works/km3.jpg" alt=""></figure>
        <div class="pcap"><b>Kaido &amp; Mai</b><span>Hanoi</span></div>
      </div>

      <div class="gallery" data-b="P" data-g="L" data-slogan="Electric heart">

        <div class="pcap"><b>Phong &amp; Linh</b><span>Phu Quoc Island</span></div>
      </div>
    </div>
  </section>

<script>
(function(){
  var namebar=document.getElementById('namebar'), ampbar=document.querySelector('.ampbar');
  if(!namebar) return;
  var whead=document.getElementById('whead'), band=document.querySelector('.whead-band');
  function headScroll(){ if(!band||!whead) return; var r=band.getBoundingClientRect(), vw=window.innerWidth, vh=window.innerHeight;
    var prog=(vh-r.top)/(vh+r.height); prog=Math.min(1,Math.max(0,prog));
    whead.style.transform='translateX('+(vw - prog*(vw+whead.scrollWidth)).toFixed(1)+'px)'; }

  var gio=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('vis'); gio.unobserve(e.target); } }); },{threshold:.16});
  document.querySelectorAll('.g').forEach(function(g){ gio.observe(g); });

  var galleries=[].slice.call(document.querySelectorAll('.gallery'));
  var brideEl=document.getElementById('bride'), groomEl=document.getElementById('groom'), sloganEl=document.getElementById('slogan');
  var curActive=0, swapping=false;
  function swapNames(i){ var g=galleries[i];
    brideEl.style.opacity='0'; groomEl.style.opacity='0'; sloganEl.style.opacity='0'; swapping=true;
    setTimeout(function(){ brideEl.textContent=g.getAttribute('data-b'); groomEl.textContent=g.getAttribute('data-g'); sloganEl.textContent=g.getAttribute('data-slogan');
      brideEl.style.opacity='1'; groomEl.style.opacity='1'; sloganEl.style.opacity='1'; swapping=false; },210); }
  function updateNames(){ var vh=window.innerHeight, cy=vh/2;
    var firstTop=galleries[0].getBoundingClientRect().top, lastBot=galleries[galleries.length-1].getBoundingClientRect().bottom;
    var show=firstTop<vh*0.40 && lastBot>vh*0.28;
    namebar.classList.toggle('show', show); if(ampbar) ampbar.classList.toggle('show', show);
    var active=curActive, bestIn=false, bestDist=Infinity;
    for(var i=0;i<galleries.length;i++){ var r=galleries[i].getBoundingClientRect();
      if(cy>=r.top && cy<=r.bottom){ active=i; bestIn=true; break; }
      var d=Math.min(Math.abs(cy-r.top),Math.abs(cy-r.bottom)); if(!bestIn && d<bestDist){ bestDist=d; active=i; } }
    if(active!==curActive && !swapping){ swapNames(active); curActive=active; } }
  var wt=false;
  function wframe(){ headScroll(); updateNames(); wt=false; }
  window.addEventListener('scroll',function(){ if(!wt){requestAnimationFrame(wframe);wt=true;} },{passive:true});
  window.addEventListener('resize',wframe);
  wframe();
})();
</script>

</html>
