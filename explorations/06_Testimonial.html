<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIS - Testimonials</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  :root{
    --ink:#160F08; --bone:#EEE6D4; --dim:#9A8E76; --gold:#C6A15B;
    --title:'Mirage','Palatino Linotype',Georgia,serif;
    --body:'SweetSans','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--ink);color:var(--bone);font-family:var(--body);overflow-x:hidden}

  .tm{position:relative;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:14vh clamp(22px,5vw,80px);background:var(--ink)}

  /* scattered small photos */
  .tm-pic{position:absolute;object-fit:cover;box-shadow:0 24px 60px rgba(0,0,0,.5);z-index:1;
    opacity:0;transition:opacity 1.4s ease,transform 1.6s cubic-bezier(.16,1,.3,1)}
  .tm.in .tm-pic{opacity:1}
  .p1{top:15%;left:8%;width:clamp(96px,9vw,168px);aspect-ratio:4/5;transform:rotate(-5deg) translateY(20px)}
  .p2{top:22%;right:9%;width:clamp(84px,7.5vw,140px);aspect-ratio:3/4;transform:rotate(4deg) translateY(20px)}
  .p3{top:58%;left:11%;width:clamp(96px,9vw,160px);aspect-ratio:5/4;transform:rotate(3deg) translateY(20px)}
  .p4{top:60%;right:8%;width:clamp(104px,10vw,180px);aspect-ratio:4/5;transform:rotate(-4deg) translateY(20px)}
  .p5{top:41%;left:5%;width:clamp(76px,6.5vw,120px);aspect-ratio:1/1;transform:rotate(6deg) translateY(20px)}
  .tm.in .p1{transform:rotate(-5deg)}
  .tm.in .p2{transform:rotate(4deg)}
  .tm.in .p3{transform:rotate(3deg)}
  .tm.in .p4{transform:rotate(-4deg)}
  .tm.in .p5{transform:rotate(6deg)}

  .tm-inner{position:relative;z-index:3;max-width:560px}
  .eyebrow{display:block;font-family:var(--body);font-weight:500;font-size:clamp(.62rem,.64vw,.75rem);
    letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
  .tm-title{font-family:var(--title);font-weight:400;font-size:clamp(2.4rem,5.4vw,6rem);line-height:1.03;
    color:var(--bone);margin:.32em 0 0;max-width:none}

  .tm-stage{margin-top:clamp(46px,7vh,90px);transition:opacity .45s ease}
  .tm-q{font-family:var(--body);font-weight:300;font-size:clamp(1rem,1.12vw,1.28rem);line-height:1.72;
    color:rgba(238,230,212,.9);margin:0 auto;max-width:440px}
  .tm-sig{margin-top:clamp(24px,3vh,38px);font-family:var(--title);font-weight:400;
    font-size:clamp(1.05rem,1.5vw,1.7rem);color:var(--gold)}

  .tm-nav{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:26px;margin-top:clamp(40px,6vh,72px)}
  .arw{width:46px;height:46px;border:1px solid rgba(238,230,212,.32);border-radius:50%;background:none;cursor:pointer;
    position:relative;transition:border-color .35s ease,background .35s ease}
  .arw::before{content:"";width:9px;height:9px;position:absolute;top:50%;left:50%;
    border-left:1.4px solid var(--bone);border-bottom:1.4px solid var(--bone);transition:border-color .35s ease}
  .arw.prev::before{transform:translate(-40%,-50%) rotate(45deg)}
  .arw.next::before{transform:translate(-60%,-50%) rotate(-135deg)}
  .arw:hover{border-color:var(--gold)}
  .arw:hover::before{border-color:var(--gold)}
  .tm-count{font-family:var(--body);font-size:.68rem;letter-spacing:.24em;color:var(--dim);min-width:64px}

  @media(max-width:820px){ .tm-pic{display:none} .tm-inner{max-width:none} }
  @media(prefers-reduced-motion:reduce){ .tm-pic{opacity:1;transform:none!important} .tm-stage{transition:none} }
</style>
</head>
<body>
  <section class="tm" id="tm">
    <img class="tm-pic p1" src="../assets/works/cj2.jpg" alt="">
    <img class="tm-pic p2" src="../assets/works/km3.jpg" alt="">
    <img class="tm-pic p3" src="../assets/works/pl2.jpg" alt="">
    <img class="tm-pic p4" src="../assets/works/cj3.jpg" alt="">
    <img class="tm-pic p5" src="../assets/works/km1.jpg" alt="">

    <div class="tm-inner">
      <span class="eyebrow">In their own words</span>
      <h2 class="tm-title">Letters from our brides &amp; grooms.</h2>

      <div class="tm-stage" id="stage">
        <blockquote class="tm-q" id="q"></blockquote>
        <div class="tm-sig" id="sig"></div>
      </div>

      <div class="tm-nav">
        <button class="arw prev" id="prev" type="button" aria-label="Previous"></button>
        <span class="tm-count" id="count">01 / 08</span>
        <button class="arw next" id="next" type="button" aria-label="Next"></button>
      </div>
    </div>
  </section>

<script>
(function(){
  var data=[
    {q:"We loved working with WIS so much!! Sunny and Thao planned the most breathtaking elopement. They were very professional, hard working, creative, communicative, sensitive, and kind. They paid so much attention to detail and knew exactly how to plan an intimate and beautiful ceremony. They are artistic and take risks that pay off. They not only made our elopement special, but also our whole experience in Asia. We will forever be grateful!", s:"Melisa & Yosef"},
    {q:"It's all in the details, and WIS definitely delivered! We've always wanted to have one in our motherland of Vietnam, and we couldn't be luckier to have found WIS. We had the pleasure of working with Sunny and her Saigon team. 1000% recommend them for anyone who's planning to have a wedding in Vietnam!", s:"Thuy & David"},
    {q:"We had a great elopement experience with WIS. Thao was very organised and we had great communication throughout the whole planning experience. Wouldn't hesitate to recommend them to anyone celebrating their wedding in Vietnam!", s:"Kyris & Grant"},
    {q:"Everything was perfect! The team navigated all the unexpected elements with grace and professionalism. We took a lot of risk with our ideas and things don't always go as planned, but the team actually made everything better than planned. It was everything we could have asked for and more.", s:"Chie & Vincent"},
    {q:"WedinStyle Team is not just wedding planners, they are the must-have friends to every couple! Every meeting, idea and detail was taken care of with enormous love and passion. Because of WedinStyle's wonderful co-operation, our wedding day became a wonderful and unforgettable memory. We will always remember them with the most thankful heart.", s:"Trang & Dima"},
    {q:"Anh has always been the spiritual foundation for us for more than a year before the wedding. Her super power is that every time she says it's okay, then it really turns out to be okay. Even with the uncontrollable, she always had plan B, C, D, so when the time came, all we had to do was nod and the show went on.", s:"Nga & Minh"},
    {q:"I am very happy with my choice. Anh is very active. We had to decide everything in just 3 weeks, and change many plans because of the weather in August. She helped us a lot, and I'm so thankful about that. I hope that you can enjoy your wedding day, just like us. Thank you!", s:"Linh & Nam"},
    {q:"It's been a month and a half since my wedding, but when I look back at the photos I still have the same feelings. I even want to get married again many times because it was so fun! I would like to thank WedinStyle a hundred thousand times for a wedding beyond my expectations. Who said weddings are tiring? I'm so happy!", s:"Thuy & Trung"}
  ];
  var N=data.length, cur=0, timer=null;
  var stage=document.getElementById('stage'), q=document.getElementById('q'), sig=document.getElementById('sig'), count=document.getElementById('count');
  function render(i){ q.textContent='"'+data[i].q+'"'; sig.textContent=data[i].s; count.textContent=('0'+(i+1)).slice(-2)+' / '+('0'+N).slice(-2); }
  render(0);
  function go(i){ cur=(i+N)%N; stage.style.opacity='0'; setTimeout(function(){ render(cur); stage.style.opacity='1'; },320); }
  function auto(){ clearInterval(timer); timer=setInterval(function(){ go(cur+1); },6000); }
  document.getElementById('next').addEventListener('click',function(){ go(cur+1); auto(); });
  document.getElementById('prev').addEventListener('click',function(){ go(cur-1); auto(); });
  var tm=document.getElementById('tm');
  tm.addEventListener('mouseenter',function(){ clearInterval(timer); });
  tm.addEventListener('mouseleave',auto);
  auto();

  var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ tm.classList.add('in'); io.disconnect(); } }); },{threshold:.3});
  io.observe(tm);
})();
</script>
</body>
</html>
